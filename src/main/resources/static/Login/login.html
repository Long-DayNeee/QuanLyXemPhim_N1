<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            width:350px;
            background:white;
            padding:25px;
            border-radius:8px;
            box-shadow:0 0 10px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-top:10px;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:20px;
            background:#0d6efd;
            color:white;
            border:none;
            cursor:pointer;
        }

        button:hover{
            background:#0b5ed7;
        }

        .error{
            color:red;
            text-align:center;
            margin-bottom:10px;
        }

        .success{
            color:green;
            text-align:center;
            margin-bottom:10px;
        }

        a{
            text-decoration:none;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Đăng nhập</h2>

    <div id="errorMsg" class="error"></div>
    <div id="successMsg" class="success"></div>

    <form action="/login" method="post">

        <label>Tên đăng nhập</label>
        <input
                type="text"
                name="username"
                required>

        <label>Mật khẩu</label>
        <input
                type="password"
                name="password"
                required>

        <button type="submit">
            Đăng nhập
        </button>

    </form>

    <p style="text-align:center;margin-top:15px">
        Chưa có tài khoản?
        <a href="/register">
            Đăng ký
        </a>
    </p>

</div>

<script>

    const params = new URLSearchParams(window.location.search);

    const error=params.get("error");
    const message=params.get("message");

    if(error){
        document.getElementById("errorMsg").innerHTML=decodeURIComponent(error);
    }

    if(message){
        document.getElementById("successMsg").innerHTML=decodeURIComponent(message);
    }

</script>

</body>
</html>
