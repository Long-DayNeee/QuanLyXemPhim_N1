<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/History/LichSuDatVeNguoiDung.css">
  <title>Lịch Sử Đặt Vé - EVL</title>
</head>

<body>
<div class="hist-page">
  <div class="hist-topbar">
    <button type="button" onclick="history.back()" class="hist-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      Quay lại trang phim
    </button>
    <div class="hist-brand">
      <img src="/DuLieu/Logo/LogoEVL.png" alt="EVL" />
      <span>EVL</span>
    </div>
  </div>

  <div class="hist-hero">
    <h2>Lịch Sử Đặt Vé</h2>
    <p>Nhập số điện thoại đã dùng khi đặt vé để tra cứu</p>

    <div class="hist-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7a7a90" stroke-width="1.8">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />
      </svg>
      <input type="tel" id="phone" name="phone" placeholder="Nhập SĐT (10 số)" required pattern="0[0-9]{9}">
      <button id="btn-view" type="button">Xem Lịch Sử</button>
    </div>
  </div>

  <div id="history" class="hist-list"></div>
</div>

<script>
  const histDiv = document.getElementById('history');
  const savedPhone = sessionStorage.getItem('phone');
  let currentPhone = '';

  function emptyState(msg) {
    histDiv.innerHTML = `<div class="hist-empty">${msg}</div>`;
  }

  function fetchHistoryByPhone(phone) {
    currentPhone = phone;
    histDiv.innerHTML = `<div class="hist-empty">Đang tải…</div>`;
    fetch(`/api/history?phone=` + encodeURIComponent(phone))
            .then(r => r.json())
            .then(data => {
              if (!data || data.length === 0) {
                emptyState('Không tìm thấy vé nào cho số điện thoại này.');
                return;
              }
              histDiv.innerHTML = data.map(r => {
                const show = new Date(r.startTime);
                const canCancel = Date.now() <= show.getTime() - 86400000;
                return `
              <div class="hist-card">
                <div class="hist-card-main">
                  <h4>${r.title}</h4>
                  <p class="hist-meta">
                    <span>${show.toLocaleString('vi-VN')}</span>
                    <span>•</span>
                    <span>Ghế ${r.seats}</span>
                    <span>•</span>
                    <span>${r.qty} vé</span>
                  </p>
                </div>
                <span class="hist-badge ${canCancel ? 'hist-badge-gold' : 'hist-badge-muted'}">
                  ${canCancel ? 'Có thể hủy' : 'Đã khóa'}
                </span>
                <div class="hist-card-actions">
                  <button class="hist-btn-outline" onclick="window.open('/HoaDon.html?group=${r.group}','_blank')">
                    In hóa đơn
                  </button>
                  ${canCancel ? `<button class="hist-btn-red" onclick="cancelGroup('${r.group}')">Hủy vé</button>` : ''}
                </div>
              </div>`;
              }).join('');
            })
            .catch(() => emptyState('Có lỗi khi tải dữ liệu, vui lòng thử lại.'));
  }

  async function cancelGroup(group) {
    if (!confirm('Bạn chắc hủy vé đặt này?')) return;
    const res = await fetch(`/api/cancel_booking?group=` + group).then(r => r.json());
    if (res.ok) {
      alert('Đã hủy vé thành công');
      fetchHistoryByPhone(currentPhone);
    } else {
      alert(res.error);
    }
  }

  if (savedPhone) {
    document.getElementById('phone').value = savedPhone;
    fetchHistoryByPhone(savedPhone);
  }

  document.getElementById('btn-view').addEventListener('click', () => {
    const phoneInput = document.getElementById('phone');
    const phone = phoneInput.value.trim();

    if (!phone) { emptyState('Vui lòng nhập số điện thoại.'); return; }
    if (!phoneInput.checkValidity()) { emptyState(phoneInput.validationMessage); return; }

    sessionStorage.setItem('phone', phone);
    fetchHistoryByPhone(phone);
  });
</script>
</body>
</html>
