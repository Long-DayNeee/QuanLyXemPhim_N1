<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/History/LichSuDatVeNguoiDung.css">
  <title>Lịch Sử Giao Dịch - EVL</title>
</head>

<body>
<div class="toast" id="toast"></div>

<div class="header">
  <div class="header-inner">
    <button class="icon-btn" onclick="history.back()" title="Quay lại">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    </button>
    <button class="icon-btn" onclick="location.href='/Home/index.html'" title="Trang chủ">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </button>
    <h1 class="header-title">Lịch Sử Giao Dịch</h1>
  </div>

  <div class="search-row">
    <input type="tel" id="phone" placeholder="Nhập SĐT đã dùng khi đặt vé" pattern="0[0-9]{9}" required />
    <button id="btn-view" type="button">Tra Cứu</button>
  </div>

  <div class="filter-row" id="filterRow"></div>
</div>

<div class="list" id="list">
  <div class="empty">
    <div class="empty-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7a7a90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v6a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h6M16 2l4 4-8 8H8v-4L16 2z"/></svg>
    </div>
    <p>Nhập số điện thoại để tra cứu vé đã đặt</p>
  </div>
</div>

<script src="/History/history.js"></script>
</body>

</html>
