spring.application.name=duanweb
server.port=8080

# ==== Database ====
# URL/host khong phai thong tin nhay cam nen de mac dinh o day cho tien.
# CHI RIENG password la KHONG duoc hard-code (se bi commit len Git) - luon truyen qua bien moi truong DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://db.moazxrfqelrmootqzauk.supabase.co:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==== Upload file (poster phim) ====
# Thu muc thuc te tren dia de luu file upload (ngoai classpath, khong bi mat khi build lai)
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
