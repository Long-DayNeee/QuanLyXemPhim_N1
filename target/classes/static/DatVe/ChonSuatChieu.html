<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chọn Suất Chiếu - EVL</title>
  <link rel="stylesheet" href="/DatVe/datve.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
<div class="toast" id="toast"></div>

<div class="backdrop">
  <img id="backdropImg" src="" alt="" />
  <button class="back-btn" onclick="history.back()">← Quay Lại</button>
</div>

<div class="content">
  <div class="hero">
    <div class="poster"><img id="posterImg" src="" alt="" /></div>
    <div class="info">
      <div class="badges" id="badges"></div>
      <h1 class="title" id="movieTitle">Đang tải…</h1>
      <div class="meta">
          <span class="meta-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z" />
            </svg>
            <span id="duration">—</span>
          </span>
      </div>
      <p class="synopsis" id="synopsis"></p>
    </div>
  </div>

  <div class="showtimes">
    <h2>Chọn Suất Chiếu</h2>
    <div class="date-row" id="dateRow"></div>
    <div class="showtime-grid" id="showtimeGrid"></div>
    <button class="confirm-btn" id="confirmBtn">Vui Lòng Chọn Suất Chiếu</button>
  </div>
</div>

<script src="/DatVe/chon-suat-chieu.js"></script>
</body>

</html>
