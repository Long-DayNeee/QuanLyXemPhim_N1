<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chọn Suất Chiếu - EVL</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/cinema-theme.css">
  <link rel="stylesheet" href="/DatVe/datve.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
  <div class="flow-page">
    <div class="flow-topbar">
      <a href="javascript:history.back()" class="flow-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Quay lại
      </a>
      <div class="flow-steps">
        <span class="flow-step active">1. Suất chiếu</span>
        <span class="flow-step">2. Chọn ghế</span>
        <span class="flow-step">3. Thanh toán</span>
      </div>
    </div>

    <div id="movieBar" class="flow-movie-bar"></div>

    <h2 class="flow-title">Chọn Suất Chiếu</h2>

    <ul class="date-tabs" id="dateTabs"></ul>

    <div id="showtimesContainer" class="showtimes"></div>

    <button id="gotoSeatsBtn" type="button" class="btn-pay wide" disabled>Chọn Ghế</button>
  </div>

  <script src="/DatVe/chon-suat-chieu.js"></script>
</body>

</html>
