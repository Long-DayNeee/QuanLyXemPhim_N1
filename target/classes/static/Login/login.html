<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập - EVL</title>
    <link rel="stylesheet" href="/Login/login.css" />
</head>
<body>

<div class="login-page">

    <div class="login-visual">
        <img class="login-visual-bg"
     src="/PRO230/Phim/28NamSauHauTanThe/28NamSauHauTanThe.jpg"
     alt="Background" />
    <div class="login-visual-scrim"></div>

    <div class="login-brand">
        <img src="/DuLieu/Logo/LogoEVL.png" alt="EVL" class="login-brand-icon" onerror="console.log('Lỗi tải logo')" />
        <span class="login-brand-name">EVL</span>
    </div>

    <div class="login-poster-stack">
        <!-- Kiểm tra lại tên file ảnh trong thư mục HalabalaRungMaTeXac -->
        <img src="/PRO230/Phim/HalabalaRungMaTeXac/Halabala.jpg" alt="Halabala"
            style="transform: rotate(-6deg) translateY(8px); z-index:1" />
        
        <img src="/PRO230/Phim/BiKipLuyenRong/BiKipLuyenRong.jpg" alt="Bí Kíp Luyện Rồng"
            style="transform: rotate(0deg); z-index:3; margin-left:-32px" />
        
        <img src="/PRO230/Phim/TRONARES/tron_ares.jpg" alt="Tron Ares"
            style="transform: rotate(6deg) translateY(8px); z-index:2; margin-left:-32px" />
    </div>

        <div class="login-tagline">
            <p class="login-tagline-sub">Trải Nghiệm Điện Ảnh</p>
            <h2 class="login-tagline-title">Đặt Vé Nhanh.<br />Xem Phim Hay.</h2>
            <p class="login-tagline-desc">
                Hàng trăm suất chiếu mỗi ngày — IMAX, 4DX, Standard. Đặt vé chỉ trong 60 giây.
            </p>
        </div>

        <div class="login-filmstrip"><div class="login-filmstrip-row"></div></div>
    </div>

    <div class="login-form-panel">
        <a href="/Home/index.html" class="login-close">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" />
            </svg>
            Đóng
        </a>

        <div class="login-mobile-brand">
            <img src="/DuLieu/Logo/LogoEVL.png" alt="EVL" class="login-brand-icon" />
            <span class="login-brand-name">EVL</span>
        </div>

        <div class="login-form-inner">
            <h1 class="login-title">Đăng Nhập</h1>
            <p class="login-subtitle">Chọn tài khoản để tiếp tục</p>

            <div class="login-tabs">
                <button type="button" class="login-tab active" data-tab="customer">🎬 Khách Hàng</button>
                <button type="button" class="login-tab" data-tab="staff">🔐 Nhân Viên</button>
            </div>

            <div id="loginBanner" class="login-banner" style="display:none"></div>

            <form id="customerForm" class="login-form active" action="/login" method="post">
                <div class="login-field">
                    <label>Tài Khoản</label>
                    <div class="login-input-wrap">
                        <svg class="login-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7a7a90" stroke-width="1.8">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" /><polyline points="22,6 12,13 2,6" />
                        </svg>
                        <input type="text" name="username" placeholder="ten@email.com" required />
                    </div>
                </div>
                <div class="login-field">
                    <div class="login-field-row">
                        <label>Mật Khẩu</label>
                        <a href="#" class="login-forgot">Quên mật khẩu?</a>
                    </div>
                    <div class="login-input-wrap">
                        <svg class="login-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7a7a90" stroke-width="1.8">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        <input type="password" name="password" placeholder="••••••••" class="pass-input" required />
                        <button type="button" class="login-eye-btn" data-toggle-pass>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-submit login-submit-red">Đăng Nhập</button>

                <div class="login-divider"><span></span><em>hoặc</em><span></span></div>

                <div class="login-social">
                    <button type="button" class="login-social-btn" title="Chưa khả dụng">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="#ea4335"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" /></svg>
                        Google
                    </button>
                    <button type="button" class="login-social-btn" title="Chưa khả dụng">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="#1877f2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" /></svg>
                        Facebook
                    </button>
                </div>

                <p class="login-register-link">
                    Chưa có tài khoản? <a href="/Login/register.html">Đăng ký ngay</a>
                </p>
            </form>

            <form id="staffForm" class="login-form" action="/login" method="post">
                <div class="login-staff-notice">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="#d4a44c"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z" /></svg>
                    Khu vực dành riêng cho nhân viên &amp; quản trị viên
                </div>

                <div class="login-field">
                    <label>Tên Đăng Nhập</label>
                    <div class="login-input-wrap">
                        <svg class="login-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7a7a90" stroke-width="1.8">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" />
                        </svg>
                        <input type="text" name="username" placeholder="Tên nhân viên" required />
                    </div>
                </div>
                <div class="login-field">
                    <label>Mật Khẩu</label>
                    <div class="login-input-wrap">
                        <svg class="login-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7a7a90" stroke-width="1.8">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        <input type="password" name="password" placeholder="••••••••" class="pass-input" required />
                        <button type="button" class="login-eye-btn" data-toggle-pass>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-submit login-submit-gold">Đăng Nhập Nhân Viên</button>
            </form>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('.login-tab').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.login-tab').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.login-form').forEach(f => f.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab + 'Form').classList.add('active');
        });
    });

    document.querySelectorAll('[data-toggle-pass]').forEach(btn => {
        btn.addEventListener('click', () => {
            const input = btn.parentElement.querySelector('.pass-input');
            input.type = input.type === 'password' ? 'text' : 'password';
        });
    });

    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    const message = params.get('message');
    const banner = document.getElementById('loginBanner');
    if (error) {
        banner.textContent = decodeURIComponent(error);
        banner.className = 'login-banner login-banner-error';
        banner.style.display = 'flex';
    } else if (message) {
        banner.textContent = decodeURIComponent(message);
        banner.className = 'login-banner login-banner-success';
        banner.style.display = 'flex';
    }
</script>
</body>
</html>
